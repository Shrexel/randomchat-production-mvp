services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: randomchat
      POSTGRES_PASSWORD: randomchat
      POSTGRES_DB: randomchat
    ports:
      - "5432:5432"
    volumes:
      - randomchat_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  randomchat_pg:
